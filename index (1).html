<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعلام الأسعار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mute:#6b7885;--line:#e3e8ed;--brand:#0f766e;--brand2:#14b8a6;--ok:#15803d;--okbg:#dcfce7;--no:#b91c1c;--nobg:#fee2e2;--hl:#fde68a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#17202a;--ink:#e8eef3;--mute:#8a99a6;--line:#263441;--brand:#2dd4bf;--brand2:#14b8a6;--ok:#4ade80;--okbg:#12361f;--no:#f87171;--nobg:#3b1616;--hl:#5b4a0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:800}
.meta{font-size:12px;color:var(--mute)}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){.btn.primary{color:#06201c}}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:18px;padding:14px 48px 14px 44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand2)}
.search input::-webkit-search-cancel-button{display:none}
.search .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search .x{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;display:none;padding:4px 8px}
.count{font-size:13px;color:var(--mute);margin-top:8px;min-height:18px}
main{padding:12px 16px 60px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.item .info{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute);margin-top:4px;align-items:center}
.code{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.stock{padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
.stock.no{background:var(--nobg);color:var(--no)}
.price{text-align:center;min-width:84px}
.price b{display:block;font-size:24px;font-weight:800;color:var(--brand);line-height:1.1}
.price small{font-size:12px;color:var(--mute)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.more{display:block;margin:12px auto}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(94vw,480px)}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 6px;font-size:18px}
dialog p{margin:6px 0;color:var(--mute);font-size:14px;line-height:1.7}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin:12px 0}
.drop.over{border-color:var(--brand2);background:var(--bg)}
.msg{font-size:14px;margin:8px 0;line-height:1.7}
.msg.err{color:var(--no)}.msg.ok{color:var(--ok)}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
dialog input[type=password]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><h1>استعلام الأسعار</h1><div class="meta" id="meta"></div></div>
    <button class="btn" id="upBtn">تحديث البيانات</button>
  </div>
  <div class="search">
    <span class="ic">🔍</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="ابحث بالاسم أو الكود أو الباركود..." autofocus>
    <button class="x" id="clr" aria-label="مسح">×</button>
  </div>
  <div class="count" id="count"></div>
</div></header>
<main><div class="wrap" id="list"></div></main>

<dialog id="dlg">
  <h2>تحديث الأسعار للجميع</h2>
  <p>1) ارفع ملف الإكسيل الجديد هنا.<br>2) اضغط «تنزيل data.json».<br>3) ارفع ملف data.json على GitHub (Add file ← Upload files ← Commit changes) وهيحل محل القديم، وتظهر الأسعار الجديدة على كل الأجهزة خلال دقيقتين.</p>
  <div class="drop" id="drop">اضغط لاختيار ملف الإكسيل أو اسحبه هنا<input type="file" id="file" accept=".xls,.xlsx,.csv" hidden></div>
  <div class="msg" id="umsg"></div>
  <div class="row"><button class="btn primary" id="apply" disabled>تنزيل data.json</button><button class="btn" id="cancel">إغلاق</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

// item = [code, name, price, stock, unit, group, buyPrice]
const $=s=>document.querySelector(s);
let DB=null, IDX=[], pending=null, shown=0, lastRes=[];
const PAGE=60;

/* ---------- normalization ---------- */
function norm(s){
  return String(s==null?'':s).toLowerCase()
   .replace(/[ً-ٰٟـ]/g,'')
   .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
   .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
   .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
   .replace(/\s+/g,' ').trim();
}
const codeNorm=s=>norm(s).replace(/[^a-z0-9ء-ي]/g,'');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- index & search ---------- */
function build(db){
  DB=db;
  IDX=db.items.map(it=>({n:norm(it[1]),c:codeNorm(it[0])}));
  $('#meta').innerHTML='<span>'+db.items.length.toLocaleString('ar-EG')+' صنف</span> &nbsp;|&nbsp; <span>آخر تحديث: '+new Date(db.updated).toLocaleDateString('ar-EG',{dateStyle:'medium'})+'</span>';
  search();
}
function search(){
  const raw=$('#q').value; $('#clr').style.display=raw?'block':'none';
  const q=norm(raw);
  if(!q){lastRes=[];render('');$('#count').textContent='اكتب للبحث في '+DB.items.length.toLocaleString('ar-EG')+' صنف';return}
  const toks=q.split(' ').filter(Boolean), qc=codeNorm(raw), numeric=/^[a-z0-9]+$/.test(qc)&&/\d/.test(qc);
  const out=[];
  for(let i=0;i<IDX.length;i++){
    const {n,c}=IDX[i]; let sc=0;
    if(numeric&&c){ if(c===qc)sc=1000; else if(c.endsWith(qc))sc=600; else if(c.startsWith(qc))sc=500; else if(qc.length>=3&&c.includes(qc))sc=300; }
    if(!sc){
      let ok=true,s=0;
      for(const t of toks){const p=n.indexOf(t); if(p<0){ok=false;break} s+= p===0||n[p-1]===' ' ? 10 : 2; }
      if(ok){ sc=50+s; if(n.startsWith(q))sc+=40; else if(n.includes(q))sc+=20; }
    }
    if(sc)out.push([sc,i]);
  }
  out.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  lastRes=out.map(x=>x[1]);
  $('#count').textContent=lastRes.length? lastRes.length.toLocaleString('ar-EG')+' نتيجة':'';
  render(toks);
}
function hl(text,toks){
  let s=esc(text); if(!toks||!toks.length)return s;
  // highlight on a diacritic-free copy only when lengths match (safe fallback otherwise)
  const nt=norm(text); if(nt.length!==text.length)return s;
  const ranges=[];
  for(const t of toks){let p=0;while((p=nt.indexOf(t,p))>=0){ranges.push([p,p+t.length]);p+=t.length}}
  if(!ranges.length)return s;
  ranges.sort((a,b)=>a[0]-b[0]);
  const m=[];for(const r of ranges){const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())}
  let o='',last=0;for(const [a,b] of m){o+=esc(text.slice(last,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';last=b}
  return o+esc(text.slice(last));
}
const fmt=p=>p==null||p===''?'—':(Math.round(p*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function row(i,toks){
  const it=DB.items[i], st=it[3];
  const stock=st==null?'':`<span class="stock ${st>0?'':'no'}">${st>0?'متوفر: '+fmt(st):'غير متوفر'}</span>`;
  return `<div class="item"><div class="info"><div class="name">${hl(it[1],toks)}</div>
   <div class="sub"><span class="code" data-c="${esc(it[0])}" title="اضغط للنسخ">${esc(it[0])}</span>${stock}</div></div>
   <div class="price"><b>${fmt(it[2])}</b><small>ج.م</small></div></div>`;
}
let curToks='';
function render(toks){
  curToks=toks; shown=0; const L=$('#list'); L.innerHTML='';
  if(toks===''){L.innerHTML='<div class="empty">ابدأ الكتابة للاستعلام عن السعر</div>';return}
  if(!lastRes.length){L.innerHTML='<div class="empty">لا توجد نتائج</div>';return}
  more();
}
function more(){
  const L=$('#list'); L.querySelector('.more')?.remove();
  const end=Math.min(shown+PAGE,lastRes.length);
  let h='';for(let k=shown;k<end;k++)h+=row(lastRes[k],curToks);
  L.insertAdjacentHTML('beforeend',h); shown=end;
  if(shown<lastRes.length){L.insertAdjacentHTML('beforeend',`<button class="btn more">عرض المزيد (${(lastRes.length-shown).toLocaleString('ar-EG')})</button>`);L.querySelector('.more').onclick=more}
}
$('#q').addEventListener('input',()=>{cancelAnimationFrame(search.f);search.f=requestAnimationFrame(search)});
$('#clr').onclick=()=>{$('#q').value='';search();$('#q').focus()};
$('#list').addEventListener('click',e=>{const c=e.target.closest('.code');if(c){navigator.clipboard?.writeText(c.dataset.c);toast('تم نسخ الكود')}});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}

/* ---------- parsing the uploaded file ---------- */
function parseRows(rows){
  let h=-1; const find=(hd,f)=>hd.findIndex(f);
  for(let i=0;i<Math.min(rows.length,15);i++){const hd=rows[i].map(norm);if(hd.some(x=>x.includes('كود'))&&hd.some(x=>x.includes('صنف')||x.includes('اسم'))){h=i;break}}
  if(h<0)throw new Error('لم أجد صف العناوين (كود الصنف / اسم الصنف). تأكد أن الملف بنفس شكل الملف الأصلي.');
  const hd=rows[h].map(norm);
  const c={code:find(hd,x=>x.includes('كود')),
    name:find(hd,x=>!x.includes('كود')&&(x.includes('صنف')||x.includes('اسم'))),
    price:find(hd,x=>x.includes('بيع')),stock:find(hd,x=>x.includes('رصيد')),
    unit:find(hd,x=>x.includes('وحد')),group:find(hd,x=>x.includes('مجمو')),buy:find(hd,x=>x.includes('شراء'))};
  if(c.code<0||c.name<0||c.price<0)throw new Error('الأعمدة المطلوبة غير موجودة: كود الصنف، اسم الصنف، آخر سعر بيع.');
  const num=v=>{if(v==null||v==='')return null;const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
  const items=[],seen=new Set();
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r)continue;
    const code=String(r[c.code]??'').trim(), name=String(r[c.name]??'').replace(/\s+/g,' ').trim();
    if(!name&&!code)continue;
    items.push([code,name,num(r[c.price]),c.stock>=0?num(r[c.stock]):null,c.unit>=0?r[c.unit]:null,c.group>=0?r[c.group]:null,c.buy>=0?num(r[c.buy]):null]);
  }
  if(!items.length)throw new Error('الملف لا يحتوي على بيانات.');
  return {updated:new Date().toISOString(),items};
}
async function readFile(f){
  if(f.name.toLowerCase().endsWith('.csv')){
    const t=await f.text();const rows=t.split(/\r?\n/).filter(Boolean).map(l=>{const o=[];let cur='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch===','&&!q){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o});
    return parseRows(rows);
  }
  if(typeof XLSX==='undefined')throw new Error('مكتبة قراءة الإكسيل لم تُحمَّل (تحتاج إنترنت). جرّب حفظ الملف كـ CSV أو اتصل بالإنترنت.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return parseRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}));
}

/* ---------- upload dialog ---------- */
const dlg=$('#dlg'),msg=(t,k='')=>{$('#umsg').textContent=t;$('#umsg').className='msg '+k};
$('#upBtn').onclick=()=>{pending=null;$('#apply').disabled=true;msg('');dlg.showModal()};
$('#cancel').onclick=()=>dlg.close();
$('#drop').onclick=()=>$('#file').click();
['dragover','dragenter'].forEach(e=>$('#drop').addEventListener(e,ev=>{ev.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(e=>$('#drop').addEventListener(e,ev=>{ev.preventDefault();$('#drop').classList.remove('over')}));
$('#drop').addEventListener('drop',ev=>handle(ev.dataTransfer.files[0]));
$('#file').onchange=e=>handle(e.target.files[0]);
async function handle(f){
  if(!f)return; msg('جاري قراءة الملف...');$('#apply').disabled=true;
  try{pending=await readFile(f);build(pending);msg(`تمت قراءة ${pending.items.length.toLocaleString('ar-EG')} صنف من «${f.name}» وهي معروضة الآن للمعاينة فقط. اضغط «تنزيل data.json» ثم ارفعه على GitHub ليظهر للجميع.`,'ok');$('#apply').disabled=false}
  catch(e){pending=null;msg(e.message,'err')}
}
$('#apply').onclick=()=>{
  if(!pending)return;
  const blob=new Blob([JSON.stringify(pending)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';document.body.appendChild(a);a.click();a.remove();
  toast('تم تنزيل data.json');
};

/* ---------- boot ---------- */
(async()=>{
  let db=null;
  try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)db=await r.json()}catch(e){}
  if(!db){db={updated:new Date().toISOString(),items:[]};$('#list').innerHTML='<div class="empty">لم يتم العثور على ملف data.json بجانب الموقع.</div>'}
  build(db);
  if(!db.items.length)$('#list').innerHTML='<div class="empty">لم يتم العثور على ملف data.json بجانب الموقع.</div>';
})();
</script>
</body>
</html>
